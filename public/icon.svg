<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Stocklana">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e17"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc6ff"/>
      <stop offset="1" stop-color="#57e3a8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Voice waveform that also reads as a rising market chart. -->
  <g fill="url(#wave)">
    <rect x="128" y="226" width="30" height="60" rx="15"/>
    <rect x="180" y="186" width="30" height="140" rx="15"/>
    <rect x="232" y="146" width="30" height="220" rx="15"/>
    <rect x="284" y="196" width="30" height="120" rx="15"/>
    <rect x="336" y="126" width="30" height="260" rx="15"/>
  </g>

  <circle cx="351" cy="106" r="26" fill="#57e3a8"/>
</svg>
